<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Meal Finder</h1>
    <p>Search for a dish and see where it comes from.</p>
  </header>

  <main>
    <form id="search-form">
      <label for="search-input">Search for a meal</label>
      <input type="text" id="search-input" required>
      <button type="submit">Search</button>
      <button type="button" id="random-btn">Surprise me</button>
    </form>

    <div id="results" aria-live="polite"></div>  </main>

  <footer>
    <p>Data from <a href="https://www.themealdb.com/">TheMealDB</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
